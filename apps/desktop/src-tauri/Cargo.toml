[package]
name = "ametista-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
[[bin]]
name = "ametista"
path = "src/main.rs"
test = false
bench = false
[dependencies]
ametista-desktop-backend.workspace = true
ametista-benchmark.workspace = true
ametista-ipc.workspace = true
ametista-watcher.workspace = true
ametista-catalog.workspace = true
ametista-core.workspace = true
ametista-windows-runtime.workspace = true
serde.workspace = true
[target.'cfg(windows)'.dependencies]
tauri = { version = "2.12.3", default-features = false, features = ["wry", "compression", "common-controls-v6"] }
rfd = { version = "0.17.2", default-features = false }
[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }
[lints]
workspace = true
