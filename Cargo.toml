[workspace]
resolver = "2"
members = ["crates/core", "crates/catalog", "crates/exec_mock", "crates/exec_registry", "crates/exec_service", "crates/exec_scheduled_task", "crates/exec_appx", "crates/exec_startup", "crates/exec_power", "crates/acceptance", "crates/windows_runtime", "crates/cli", "crates/ipc", "crates/helper", "crates/desktop_backend", "crates/metrics", "crates/benchmark", "crates/watcher", "crates/monitor", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.6.5"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
jsonschema = { version = "0.46", default-features = false }
tempfile = "3"
ametista-core = { path = "crates/core" }
ametista-catalog = { path = "crates/catalog" }
ametista-exec-mock = { path = "crates/exec_mock" }
ametista-windows-runtime = { path = "crates/windows_runtime" }
base64 = "0.22"
getrandom = "0.4"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
ametista-ipc = { path = "crates/ipc" }
ametista-desktop-backend = { path = "crates/desktop_backend" }
ametista-metrics = { path = "crates/metrics" }
ametista-benchmark = { path = "crates/benchmark" }
ametista-watcher = { path = "crates/watcher" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
