[workspace]
resolver = "2"
members = ["crates/core", "crates/catalog", "crates/exec_mock", "crates/exec_registry", "crates/exec_service", "crates/exec_scheduled_task", "crates/exec_appx", "crates/exec_startup", "crates/exec_power", "crates/acceptance", "crates/windows_runtime", "crates/cli"]

[workspace.package]
version = "0.3.0"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
jsonschema = { version = "0.46", default-features = false }
tempfile = "3"
gametune-core = { path = "crates/core" }
gametune-catalog = { path = "crates/catalog" }
gametune-exec-mock = { path = "crates/exec_mock" }
gametune-windows-runtime = { path = "crates/windows_runtime" }
base64 = "0.22"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
