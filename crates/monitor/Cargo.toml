[package]
name = "gametune-monitor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"
[[bin]]
name = "gametune-monitor"
path = "src/main.rs"
test = false
bench = false
[dependencies]
gametune-watcher.workspace = true
gametune-ipc.workspace = true
gametune-catalog.workspace = true
gametune-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
[target.'cfg(windows)'.dependencies]
windows-sys = {version="0.61",features=["Win32_UI_Shell","Win32_UI_WindowsAndMessaging","Win32_System_LibraryLoader","Win32_System_Com","Win32_Graphics_Gdi"]}
[build-dependencies]
embed-resource = "3"
[lints.rust]
unsafe_code = "deny"
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
