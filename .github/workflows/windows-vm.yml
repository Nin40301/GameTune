name: Dedicated Windows VM integration
on:
  workflow_dispatch:
    inputs:
      snapshot_confirmed:
        description: Disposable VM snapshot exists and runner is elevated in an interactive desktop
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  roundtrip:
    if: inputs.snapshot_confirmed
    runs-on: [self-hosted, Windows, X64, gametune-disposable]
    timeout-minutes: 20
    env:
      GAMETUNE_DISPOSABLE_VM: I_HAVE_A_SNAPSHOT
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Dedicated apply/undo and protected-store tests
        run: cargo test -p gametune-windows-runtime --features vm-tests --test windows_vm --locked --offline -- --ignored --test-threads=1
      - name: Dedicated HKCU raw type and recovery tests
        run: cargo test -p gametune-windows-runtime --features vm-tests --lib dedicated_hkcu --locked --offline -- --ignored --test-threads=1
      - name: Preserve complete snapshots even on failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dedicated-windows-snapshots
          path: crates/windows_runtime/work/windows-vm/
          if-no-files-found: warn
          retention-days: 7
