name: Dedicated Windows VM integration
on:
  workflow_dispatch:
    inputs:
      snapshot_confirmed:
        description: Disposable VM snapshot exists and runner is elevated in an interactive desktop
        required: true
        type: boolean
        default: false
permissions: {}
concurrency:
  group: manual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  roundtrip:
    permissions:
      contents: read
    if: inputs.snapshot_confirmed
    runs-on: [self-hosted, Windows, X64, ametista-disposable]
    timeout-minutes: 30
    env:
      AMETISTA_DISPOSABLE_VM: I_HAVE_A_SNAPSHOT
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.1 --profile minimal
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Dedicated apply/undo and protected-store tests
        run: cargo test -p ametista-windows-runtime --features vm-tests --test windows_vm --locked --offline -- --ignored --test-threads=1
      - name: Dedicated HKCU raw type and recovery tests
        run: cargo test -p ametista-windows-runtime --features vm-tests --lib dedicated_hkcu --locked --offline -- --ignored --test-threads=1
      - name: Preserve complete snapshots even on failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        with:
          name: dedicated-windows-snapshots
          path: crates/windows_runtime/work/windows-vm/
          if-no-files-found: warn
          retention-days: 7
