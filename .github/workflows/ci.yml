name: GameTune Rust

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Select stable Rust
        run: rustup default stable
      - name: Fetch locked dependencies (build only)
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Test without network
        run: cargo test --workspace --locked --offline
      - name: Compile VM harness without running administrative tests
        run: cargo test -p gametune-windows-runtime --features vm-tests --locked --offline --no-run
      - name: Build default-feature release (no fixture authorization)
        run: cargo build --workspace --release --locked --offline
      - name: Run mock simulation
        run: cargo run -p gametune-catalog --example simulate --locked --offline
      - name: Publish validated catalog
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-catalog-${{ matrix.os }}
          path: |
            catalog/*.json
            Cargo.lock
            docs/catalog-sources.md
          retention-days: 14
