name: Draft portable release
on:
  push:
    tags: ['v*']
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  build:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag equals application version
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -cne ('v' + $version)) { throw 'Tag/version mismatch' }
      - run: rustup toolchain install 1.98.1 --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-windows-1.98.1-${{ hashFiles('Cargo.lock') }}-v1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: ./tools/build-release.ps1
      - run: ./tools/verify-desktop.ps1
      - run: ./tools/package-portable.ps1 -Destination outputs/release
      - name: CycloneDX SBOMs (build tools only)
        shell: pwsh
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          if ($LASTEXITCODE -ne 0) { throw 'SBOM tool installation failed' }
          $env:SOURCE_DATE_EPOCH = git show -s --format=%ct HEAD
          cargo cyclonedx --format json --spec-version 1.5 --all --target x86_64-pc-windows-msvc --override-filename ametista-rust-sbom
          if ($LASTEXITCODE -ne 0) { throw 'Rust SBOM generation failed' }
          $sboms = Get-ChildItem crates,apps/desktop/src-tauri -Recurse -Filter ametista-rust-sbom.json -File
          if ($sboms.Count -ne 20) { throw 'Expected one SBOM per workspace crate' }
          foreach ($bom in $sboms) {
            $crate = (Get-Content ($bom.Directory.FullName + '/Cargo.toml') -Raw | Select-String '(?m)^name = "([^"]+)"').Matches.Groups[1].Value
            Copy-Item -LiteralPath $bom.FullName -Destination ('outputs/release/' + $crate + '.cdx.json')
          }
          npm sbom --prefix apps/desktop --omit=dev --package-lock-only --sbom-format cyclonedx > outputs/release/ametista-frontend.cdx.json
          if ($LASTEXITCODE -ne 0) { throw 'Frontend SBOM generation failed' }
      - name: Hash all deliverables
        shell: pwsh
        run: |
          $lines = Get-ChildItem outputs/release -File | Sort-Object Name | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $_.Name }
          [IO.File]::WriteAllLines((Join-Path $PWD 'outputs/release/SHA256SUMS.txt'), $lines, [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-release
          path: outputs/release/*
          if-no-files-found: error
          retention-days: 14
  attest-and-draft:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_REPO: ${{ github.repository }}
    steps:
      # No checkout or project/build script runs with this job's write/OIDC token.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: portable-release
          path: release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
          create-storage-record: false
      - name: Create draft only (owner reviews and publishes)
        shell: bash
        run: |
          printf '%s\n' 'Ametista alpha. Test only in a disposable VM, never on your main PC.' 'Unsigned portable builds. Writable portable folders cannot elevate. Check SHA256SUMS and GitHub provenance before use. See repository recovery and release documentation.' > notes.txt
          gh release create "$RELEASE_TAG" release/* --repo "$RELEASE_REPO" --verify-tag --draft --prerelease --title "Ametista $RELEASE_TAG alpha" --notes-file notes.txt
      # Future signing secret names are documented only; no certificate is read here.
